name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo build --release && ./target/release/dom2figma plugin --dir /tmp/plugin && node scripts/smoke-plugin.js tests/fixtures/sample-screens.json

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: dom2figma-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: dom2figma-macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            name: dom2figma-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/dom2figma dist/${{ matrix.name }}
          tar -C dist -czf dist/${{ matrix.name }}.tar.gz ${{ matrix.name }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/${{ matrix.name }}.tar.gz
