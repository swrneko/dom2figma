name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
      - name: Smoke-test Figma plugin on fixture JSON
        run: |
          ./target/release/dom2figma plugin --dir /tmp/plugin
          node scripts/smoke-plugin.js tests/fixtures/sample-screens.json
      - name: End-to-end capture with system Chrome
        run: |
          which google-chrome chromium chromium-browser || true
          cargo test -- --ignored
